name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
    strategy:
      matrix:
        # Gtk 4.22 needs a newer runner than the Gtk 3 build used: ubuntu-22.04
        # has no libgtk-4 recent enough for the smoke run below. The build alone
        # does not need Gtk installed, because the api.xml files are vendored.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Run build.cake
        run: dotnet cake build.cake
        env:
          GITHUB_ACTIONS: true
      # The tests call into Gtk rather than merely compiling against it, which
      # is the only way to catch a removed native export: FuncLoader returns a
      # null delegate for a missing symbol, so it is not a link error.
      - name: Install Gtk 4 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libadwaita-1-0 libgtksourceview-5-0 xvfb
      - name: Run tests headless
        run: xvfb-run -a dotnet cake build.cake --BuildTarget=Test
      - uses: actions/upload-artifact@main
        with:
          name: NuGet Packages
          path: |
            BuildOutput/NugetPackages/**/*.nupkg
          if-no-files-found: error
      - name: Push NuGet to GitHub packages
        run: dotnet nuget push BuildOutput/NugetPackages/**/*.nupkg --source https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json --api-key ${GITHUB_TOKEN}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
