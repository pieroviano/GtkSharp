name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    # The api.xml files are generated from the .gir files vendored in
    # Source/Gir, which come from Debian forky -- Gtk 4.22.4, libadwaita 1.9,
    # webkitgtk 2.52.5 (see Source/Gir/README.md). No Ubuntu LTS runner ships
    # anything that new: 24.04 has Gtk 4.14, eight minor versions behind.
    #
    # That gap matters more here than it looks. A symbol the binding declares
    # but the installed library lacks is not a link error -- FuncLoader returns
    # a null delegate and the call throws when it is reached. Testing against
    # an older Gtk than the binding describes would therefore leave exactly the
    # class of bug this suite exists to find undetectable, while still reporting
    # green.
    #
    # Running the job in a debian:forky container fixes the versions to the ones
    # the bindings were generated from, so a failure here is a real defect.
    container:
      image: debian:forky

    env:
      DOTNET_ROOT: /usr/local/dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      # libicu is not optional: without it the .NET host aborts before Main
      # ("Couldn't find a valid ICU package installed on the system"), which
      # looks nothing like a missing dependency.
      #
      # dbus is likewise load-bearing rather than cosmetic. Gtk 4.22 on forky
      # loads images through glycin, which runs each loader in a bwrap sandbox
      # it talks to over a bus. With no session bus the loader cannot start and
      # takes the test host down with it -- and a killed host still prints
      # "Passed!", for whatever finished first. Hence dbus-run-session below.
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git dbus libicu-dev \
            libgtk-4-1 libadwaita-1-0 libgtksourceview-5-0 \
            libwebkitgtk-6.0-4 libjavascriptcoregtk-6.0-1 \
            xvfb xauth

      # forky has no dotnet-sdk-8.0 package at all -- Debian dropped it -- so
      # the SDK comes from Microsoft's install script rather than from apt.
      # $GITHUB_PATH is what carries it to the steps that follow; a plain
      # `export` would not, each step being its own shell.
      - name: Install the .NET 8 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- \
            --channel 8.0 --install-dir "$DOTNET_ROOT"
          echo "$DOTNET_ROOT" >> $GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Run build.cake
        run: dotnet cake build.cake
        env:
          GITHUB_ACTIONS: true

      # The tests call into Gtk rather than merely compiling against it, which
      # is the only way to catch a removed or missing native export.
      #
      # WebKit spawns its network and web processes into a bwrap sandbox, which
      # needs user namespaces a container is not guaranteed to be allowed to
      # create. When it cannot, it does not fail the call -- it aborts the
      # process ("bwrap: Creating new namespace failed", then "Failed to fully
      # launch dbus-proxy"), and the run ends mid-suite with a truncated total
      # under a "Passed!" line.
      #
      # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS was set here to get past that
      # and has been removed deliberately. This job holds a GITHUB_TOKEN with
      # packages:write, and turning the sandbox off would have meant rendering
      # documents in that job with no isolation. The sample no longer fetches a
      # remote page -- WebviewSection navigates to a file:// URI it writes
      # itself -- so there is no untrusted content here to need the escape.
      #
      # bwrap indeed cannot start here: Docker's default seccomp profile
      # refuses clone(CLONE_NEWUSER), so the container gets no user namespace.
      # As this comment used to instruct, the WebKit-backed sections are now
      # skipped rather than the flag restored -- GtkSharp.Tests/WebKitSandbox.cs
      # runs the same operation bwrap would, before anything constructs them.
      #
      # That costs the WebKit page-load coverage. To buy it back, give the
      # container the namespace and leave WebKit's own sandbox on:
      #
      #   container:
      #     image: debian:forky
      #     options: --security-opt seccomp=unconfined
      #
      # The skip is self-disabling -- its probe then succeeds and the sections
      # run again, with nothing here to undo. It has not been enabled by
      # default because it relaxes the syscall filter for the whole job, this
      # one included, and that is a wider grant than the coverage is worth.
      - name: Run tests headless
        run: dbus-run-session -- xvfb-run -a dotnet cake build.cake --BuildTarget=Test

      - uses: actions/upload-artifact@v4
        with:
          name: NuGet Packages
          path: |
            BuildOutput/NugetPackages/**/*.nupkg
          if-no-files-found: error

      - name: Push NuGet to GitHub packages
        run: dotnet nuget push BuildOutput/NugetPackages/**/*.nupkg --source https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json --api-key ${GITHUB_TOKEN}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
